name: GAME Desktop Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    # Electron migration has its own installer workflow; do not run the
    # legacy Tauri artifact uploader against the Electron release directory.
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'migration/') }}
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: https://ufnpohdmrndxtycnwkfa.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmbnBvaGRtcm5keHR5Y253a2ZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MjE5NjAsImV4cCI6MjExMDM5Nzk2MH0.O2Yl-TvnndHcorq6_idMLKGvFajCr4665vH4OYI6Y54
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read desktop version
        id: app-version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Building GAME desktop version $version"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate a clean Windows ICO resource
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          @'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          icon_path = Path("src-tauri/icons/icon.ico")
          icon_path.parent.mkdir(parents=True, exist_ok=True)

          # Generate a fresh, valid icon instead of trying to decode the
          # malformed ICO currently committed in the repository.
          image = Image.new("RGBA", (1024, 1024), (12, 25, 48, 255))
          draw = ImageDraw.Draw(image)
          draw.rounded_rectangle((72, 72, 952, 952), radius=190, fill=(24, 70, 125, 255), outline=(93, 180, 255, 255), width=28)
          draw.rounded_rectangle((145, 145, 879, 879), radius=145, outline=(160, 215, 255, 255), width=18)

          try:
              font = ImageFont.truetype("C:/Windows/Fonts/arialbd.ttf", 610)
          except OSError:
              font = ImageFont.load_default()

          text = "G"
          bounds = draw.textbbox((0, 0), text, font=font, stroke_width=0)
          x = (1024 - (bounds[2] - bounds[0])) / 2 - bounds[0] - 10
          y = (1024 - (bounds[3] - bounds[1])) / 2 - bounds[1] - 30
          draw.text((x, y), text, font=font, fill=(255, 255, 255, 255))

          image.save(
              icon_path,
              format="ICO",
              sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)],
          )

          with Image.open(icon_path) as check:
              assert check.format == "ICO", f"Unexpected format: {check.format}"
              assert check.ico.sizes() >= {(16, 16), (32, 32), (48, 48), (256, 256)}
              print(f"Generated and validated Windows ICO sizes: {sorted(check.ico.sizes())}")
          '@ | Set-Content -Encoding utf8 generate_icon.py
          python generate_icon.py

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Build Windows desktop installer
        run: npm run desktop:build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: GAME-v${{ steps.app-version.outputs.version }}-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
