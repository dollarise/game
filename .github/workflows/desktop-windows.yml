name: GAME Desktop Windows Installer

on:
  push:
    branches: [main, rebuild/electron-chromium]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: https://ufnpohdmrndxtycnwkfa.supabase.co
      VITE_SUPABASE_ANON_KEY: \${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build GAME Electron Windows installer
        run: npm run desktop:build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: GAME-v2.0.0-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
