name: GAME Desktop Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: https://ufnpohdmrndxtycnwkfa.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmbnBvaGRtcm5keHR5Y253a2ZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MjE5NjAsImV4cCI6MjExMDM5Nzk2MH0.O2Yl-TvnndHcorq6_idMLKGvFajCr4665vH4OYI6Y54
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Build Windows desktop installer
        run: npm run desktop:build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: GAME-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
